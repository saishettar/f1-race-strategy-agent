target: "eval.target:pit_decision"

tests:
  - description: "pits on worn soft tires with a rival in undercut range"
    vars:
      session_key: 9523
      lap_number: 32
      compound: "SOFT"
      tire_age: 26
      gap_ahead: 8.0
      gap_behind: 1.0
      gap_to_leader: 22.0
      rival_ahead_compound: "HARD"
      rival_ahead_tire_age: 10
      rival_ahead_number: 44
      track_temp: 38.0
      air_temp: 24.0
    assert:
      - type: regex
        value: "^PIT"
      - type: latency
        threshold_ms: 30000
      - type: llm-rubric
        rubric: >
          Does the decision recommend pitting, and does the reasoning
          reference the tire being worn/old and the close gap behind as
          undercut risk (not just one of the two)?

  - description: "stays out on fresh hard tires with no threats nearby"
    vars:
      session_key: 9523
      lap_number: 8
      compound: "HARD"
      tire_age: 5
      gap_ahead: 6.0
      gap_behind: 15.0
      gap_to_leader: 4.0
      track_temp: 38.0
      air_temp: 24.0
    assert:
      - type: regex
        value: "^STAY OUT"
      - type: latency
        threshold_ms: 30000
      - type: llm-rubric
        rubric: >
          Does the decision recommend staying out, with reasoning that
          references the tire still being fresh/early and no immediate
          threat from behind?
